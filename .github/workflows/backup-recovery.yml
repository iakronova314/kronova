name: Encrypted backup and recovery drill

on:
  schedule:
    - cron: '20 4 * * 0'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  backup-and-restore:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - name: Require disaster-recovery secrets
        env:
          DB_URL: ${{ secrets.BACKUP_DATABASE_URL }}
          ENC: ${{ secrets.BACKUP_ENCRYPTION_PASSWORD }}
          S3_ENDPOINT: ${{ secrets.SUPABASE_S3_ENDPOINT }}
          S3_KEY: ${{ secrets.SUPABASE_S3_ACCESS_KEY }}
          S3_SECRET: ${{ secrets.SUPABASE_S3_SECRET_KEY }}
        run: test -n "$DB_URL" && test -n "$ENC" && test -n "$S3_ENDPOINT" && test -n "$S3_KEY" && test -n "$S3_SECRET"
      - name: Export database and Storage
        env:
          DB_URL: ${{ secrets.BACKUP_DATABASE_URL }}
          AWS_ACCESS_KEY_ID: ${{ secrets.SUPABASE_S3_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.SUPABASE_S3_SECRET_KEY }}
          AWS_DEFAULT_REGION: ${{ secrets.SUPABASE_S3_REGION }}
          S3_ENDPOINT: ${{ secrets.SUPABASE_S3_ENDPOINT }}
        run: |
          mkdir -p backup/storage
          pg_dump --dbname="$DB_URL" --format=custom --no-owner --no-acl --file=backup/database.dump
          aws s3 sync s3://documents backup/storage/documents --endpoint-url "$S3_ENDPOINT" --only-show-errors
          tar -C backup -czf backup.tar.gz database.dump storage
      - name: Encrypt backup
        env:
          BACKUP_ENCRYPTION_PASSWORD: ${{ secrets.BACKUP_ENCRYPTION_PASSWORD }}
        run: openssl enc -aes-256-cbc -pbkdf2 -salt -in backup.tar.gz -out kronova-${{ github.run_id }}.tar.gz.enc -pass env:BACKUP_ENCRYPTION_PASSWORD
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.BACKUP_AWS_ROLE_ARN }}
          aws-region: ${{ secrets.BACKUP_AWS_REGION }}
      - name: Upload off-site immutable copy
        run: aws s3 cp kronova-${{ github.run_id }}.tar.gz.enc s3://${{ secrets.BACKUP_S3_BUCKET }}/kronova/weekly/ --sse aws:kms --sse-kms-key-id "${{ secrets.BACKUP_KMS_KEY_ID }}" --only-show-errors
      - name: Restore drill in isolated PostgreSQL
        env:
          BACKUP_ENCRYPTION_PASSWORD: ${{ secrets.BACKUP_ENCRYPTION_PASSWORD }}
        run: |
          openssl enc -d -aes-256-cbc -pbkdf2 -in kronova-${{ github.run_id }}.tar.gz.enc -out restore.tar.gz -pass env:BACKUP_ENCRYPTION_PASSWORD
          mkdir restore && tar -C restore -xzf restore.tar.gz
          docker run --name kronova-restore -e POSTGRES_PASSWORD=restore-only -p 55432:5432 -d postgres:17
          for attempt in {1..30}; do pg_isready -h 127.0.0.1 -p 55432 -U postgres && break; sleep 2; done
          PGPASSWORD=restore-only pg_restore --host=127.0.0.1 --port=55432 --username=postgres --dbname=postgres --no-owner --no-acl restore/database.dump
          PGPASSWORD=restore-only psql --host=127.0.0.1 --port=55432 --username=postgres --dbname=postgres -v ON_ERROR_STOP=1 -c "select count(*) from public.tenants;"
          test -d restore/storage/documents
      - name: Destroy plaintext working copies
        if: always()
        run: rm -rf backup restore backup.tar.gz restore.tar.gz kronova-*.tar.gz.enc
